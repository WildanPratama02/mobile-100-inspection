  'multer@>=2.0.0 <2.5.0': '>=2.5.0 <3'
  'fast-uri@>=3.0.0 <3.1.9': '>=3.1.9 <4'
  'fflate@>=0.8.0 <0.8.3': '0.8.3'
  'esbuild@>=0.27.3 <0.28.1': '0.28.1'
  'minimatch@>=10.0.0 <11.0.1': '11.0.1'
  'minimatch@>=9.0.0 <10.0.0': '11.0.1'
  'glob@>=13.0.0 <14.0.2': '14.0.2'
  'glob@>=11.0.0 <12.0.0': '14.0.2'

onlyBuiltDependencies:
