<title>Mobile 100% Inspection</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: landscape two-pane shop-floor tool. Home = PO list | Top 5 | result stats + one big ADD DEFECT bar.
   Input Defect = shoe map on the left, drill-down list + history + BACK/HOME/UNDO on the right. Portrait stacks the panes. */
:root{
  --font-ui:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#D9DEE4; --panel:#E7EAEE; --surface:#FFFFFF; --surface-2:#F0F2F5; --line:#B7BFC9; --line-soft:#D0D6DD;
  --ink:#0E1217; --ink-2:#444D58; --ink-3:#69727E; --on-ink:#FFFFFF;
  --focus:#1D4ED8; --hit:#1D4ED8; --hit-bg:#DAE5FF;
  --minor-fg:#6A4700; --minor-bg:#F7E4AE; --major-fg:#8A2A04; --major-bg:#F8CFB8; --crit-fg:#FFFFFF; --crit-bg:#B3123A;
  --ok:#0A7446; --danger:#B3123A; --warn-bg:#FFF0D0; --scrim:rgba(14,18,23,.5);
  --shoe-upper:#C3C9D1; --shoe-upper-2:#D6DBE1; --shoe-mid:#F7F8FA; --shoe-out:#2B313A; --shoe-line:#838C98; --shoe-tongue:#E1E5EA; --shoe-patch:#0E1217;
  --shadow:0 12px 34px rgba(14,18,23,.28);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F13; --panel:#171B21; --surface:#1F242C; --surface-2:#161A20; --line:#3A424D; --line-soft:#2A313A;
  --ink:#EEF1F5; --ink-2:#B4BCC7; --ink-3:#8993A0; --on-ink:#0E1217;
  --focus:#7AA2FF; --hit:#5B8CFF; --hit-bg:#1B2A52;
  --minor-fg:#F4C75A; --minor-bg:#3A2D08; --major-fg:#FFA070; --major-bg:#40200C; --crit-fg:#FFFFFF; --crit-bg:#D3254E;
  --ok:#47D89B; --danger:#FF6B8B; --warn-bg:#3A2D10; --scrim:rgba(0,0,0,.62);
  --shoe-upper:#4A525D; --shoe-upper-2:#59626E; --shoe-mid:#8A929D; --shoe-out:#14171C; --shoe-line:#8C95A1; --shoe-tongue:#6A737F; --shoe-patch:#EEF1F5;
  --shadow:0 12px 34px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F13; --panel:#171B21; --surface:#1F242C; --surface-2:#161A20; --line:#3A424D; --line-soft:#2A313A;
  --ink:#EEF1F5; --ink-2:#B4BCC7; --ink-3:#8993A0; --on-ink:#0E1217;
  --focus:#7AA2FF; --hit:#5B8CFF; --hit-bg:#1B2A52;
  --minor-fg:#F4C75A; --minor-bg:#3A2D08; --major-fg:#FFA070; --major-bg:#40200C; --crit-fg:#FFFFFF; --crit-bg:#D3254E;
  --ok:#47D89B; --danger:#FF6B8B; --warn-bg:#3A2D10; --scrim:rgba(0,0,0,.62);
  --shoe-upper:#4A525D; --shoe-upper-2:#59626E; --shoe-mid:#8A929D; --shoe-out:#14171C; --shoe-line:#8C95A1; --shoe-tongue:#6A737F; --shoe-patch:#EEF1F5;
  --shadow:0 12px 34px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.25;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-weight:500}
.app{height:100%;min-height:330px;display:flex;flex-direction:column}
.disp{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.ico{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* chips */
.chip{display:inline-block;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.06em;line-height:1;padding:3px 6px 2px;border-radius:3px;white-space:nowrap;vertical-align:middle}
.chip.c1{background:var(--minor-bg);color:var(--minor-fg)}
.chip.c2{background:var(--major-bg);color:var(--major-fg)}
.chip.c3{background:var(--crit-bg);color:var(--crit-fg)}
.chip.role,.chip.mRW{background:var(--ink);color:var(--on-ink)}
.chip.mBG{background:var(--hit);color:#fff}
.chip.mode{font-size:13px;padding:4px 8px 3px}

/* ---------- login ---------- */
.login{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:0;min-height:0;border:1px solid var(--line);background:var(--surface)}
.brand{background:var(--ink);color:var(--on-ink);padding:clamp(18px,4vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-width:0}
.brand h1{margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;line-height:.88;font-size:clamp(38px,6.4vw,76px);letter-spacing:.01em}
.brand h1 small{display:block;font-size:.32em;letter-spacing:.22em;font-weight:500;margin-top:.5em;opacity:.7}
.brand ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:clamp(14px,1.6vw,17px);opacity:.88}
.brand li{display:flex;gap:10px;align-items:baseline}
.brand li b{font-family:var(--font-display);font-weight:600;letter-spacing:.08em;min-width:7.5em;text-transform:uppercase;opacity:.65}
.lform{padding:clamp(16px,3.5vw,40px);display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0;overflow:auto}
.lform h2{margin:0 0 2px;font-size:22px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.04em}
.field{display:grid;gap:4px}
.field>span{font-family:var(--font-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sel{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:8px 14px;background:var(--surface-2);border:1.5px solid var(--line);font-size:19px;font-weight:500;width:100%}
.sel[aria-expanded="true"]{border-color:var(--ink)}
.sel .ph{color:var(--ink-3);font-weight:400}
.sel .ico{color:var(--ink-3)}
.namebox{min-height:52px;padding:8px 14px;border:1.5px dashed var(--line);display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600}
.namebox .ph{color:var(--ink-3);font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;background:var(--ink);color:var(--on-ink);font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:.08em;text-transform:uppercase;width:100%}
.btn[disabled]{opacity:.28;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{min-height:46px;font-size:18px}
.demo{font-size:12px;color:var(--ink-3);margin-top:2px}

/* ---------- home ---------- */
.home{flex:1;min-height:0;display:grid;border:1px solid var(--line);background:var(--bg);
  grid-template-columns:clamp(150px,19vw,214px) minmax(0,1fr) clamp(230px,29vw,330px);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"pohead info info" "polist main stats" "polist add add"}
.pohead{grid-area:pohead;display:flex;align-items:center;justify-content:center;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--font-display);font-size:21px;letter-spacing:.06em;text-transform:uppercase;min-height:52px}
.info{grid-area:info;display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.meta{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:2px 22px;padding:6px 14px;min-width:0}
.meta div{display:flex;flex-direction:column;min-width:0}
.meta small{font-family:var(--font-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.meta b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20ch}
.meta .po{font-family:var(--font-mono);font-size:14px}
.who{display:flex;align-items:center;gap:8px;padding:0 6px 0 10px}
.who span{font-size:13px;text-align:right;line-height:1.15;color:var(--ink-2)}
.who span b{display:block;color:var(--ink);font-size:14px}
.gear{width:62px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;align-self:stretch}
.gear .ico{width:32px;height:32px;stroke-width:1.8}
.polist{grid-area:polist;display:flex;flex-direction:column;background:var(--surface-2);border-right:1px solid var(--line);min-height:0}
.pos{flex:1;overflow:auto;min-height:0}
.po-item{display:block;width:100%;padding:14px 12px;font-family:var(--font-mono);font-style:italic;font-size:15.5px;border-bottom:1px solid var(--line-soft);background:var(--surface);position:relative}
.po-item small{display:block;font-family:var(--font-ui);font-style:normal;font-size:12px;color:var(--ink-3);margin-top:3px}
.po-item[aria-current="true"]{background:var(--ink);color:var(--on-ink)}
.po-item[aria-current="true"] small{color:var(--on-ink);opacity:.7}
.po-item .live{display:block;font-style:normal;font-family:var(--font-ui);font-size:11.5px;font-weight:600;color:var(--hit);margin-top:3px}
.po-item[aria-current="true"] .live{color:var(--on-ink);opacity:.85}
.po-item .cnt{position:absolute;right:10px;top:12px;font-style:normal;font-family:var(--font-display);font-weight:700;font-size:15px;background:var(--hit);color:#fff;border-radius:99px;min-width:24px;padding:2px 7px;text-align:center}
.addpo{margin:10px;min-height:62px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line)}
.addpo .ico{width:34px;height:34px;stroke-width:2.4}
.main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 10px 10px;gap:8px}
.t5{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--ink)}
.t5 h2{margin:0;padding:8px 12px 6px;text-align:center;font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--ink)}
.t5body{flex:1;overflow:auto;min-height:0}
.t5row{display:grid;grid-template-columns:34px minmax(0,1fr) 64px auto;align-items:center;border-bottom:1px solid var(--line-soft);min-height:58px}
.t5row>*{padding:8px 10px}
.t5body.nophoto .t5row{grid-template-columns:34px minmax(0,1fr) 64px}
.t5row .no{color:var(--ink-3);font-size:13px;padding-right:0;align-self:start;padding-top:12px}
.t5row .nm{font-size:14.5px;line-height:1.22;overflow-wrap:anywhere}
.t5row .nm small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px}
.t5row .q{font-family:var(--font-display);font-weight:700;font-size:30px;text-align:center;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);align-self:stretch;display:grid;place-items:center;padding:0 4px}
.ph-btn{display:flex;align-items:center;justify-content:center;gap:6px;min-width:88px;min-height:46px;border:1.5px solid var(--ink);font-family:var(--font-display);font-weight:600;letter-spacing:.06em;font-size:15px;background:var(--surface)}
.ph-btn.need{border-style:dashed;border-color:var(--danger);color:var(--danger)}
.ph-btn.thumb{padding:0;overflow:hidden;width:88px;height:56px;border-color:var(--ok);position:relative}
.ph-btn.thumb img{width:100%;height:100%;object-fit:cover}
.ph-btn.thumb i{position:absolute;right:2px;bottom:2px;background:var(--ok);color:#fff;border-radius:99px;width:18px;height:18px;display:grid;place-items:center}
.ph-btn.thumb i .ico{width:12px;height:12px;stroke-width:3.2}
.t5empty{padding:28px 20px;text-align:center;color:var(--ink-3);display:grid;gap:6px;place-content:center;height:100%}
.t5empty b{font-family:var(--font-display);font-size:22px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.stats{grid-area:stats;padding:10px 10px 10px 0;min-height:0;display:flex}
.statbox{flex:1;background:var(--panel);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto}
.stat{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-soft);min-height:40px}
.stat.col{flex-direction:column;align-items:stretch;gap:4px}
.stat:last-of-type{border-bottom:0}
.stat label,.stat>span:first-child{font-family:var(--font-display);font-size:15.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.stat b{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:.01em}
.stat b small{font-size:.55em;font-weight:600;color:var(--ink-3);margin-left:2px}
.stepper{display:flex;align-items:center;gap:4px;justify-content:space-between}
.stepper button{min-width:44px;min-height:42px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:18px}
.stepper b{flex:1;text-align:center;padding:0 4px;font-size:28px}
.sev{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.sev div{background:var(--surface);border:1px solid var(--line-soft);padding:5px 6px;text-align:center}
.sev b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.05}
.rate-ok{color:var(--ok)}.rate-bad{color:var(--danger)}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:10px}
.exports .btn{font-size:16px;min-height:46px;padding:0 6px}
.addrow{grid-area:add;display:flex;background:var(--surface);border-top:1px solid var(--ink);min-width:0}
.exp{display:flex;align-items:center;justify-content:center;gap:8px;min-width:clamp(104px,14vw,150px);border-left:1px solid var(--line);font-family:var(--font-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.exp span{display:flex;flex-direction:column;line-height:1.05}.exp b{font-size:21px;color:var(--ink);letter-spacing:.06em}
.exp:active{background:var(--ink);color:var(--on-ink)}.exp:active b{color:var(--on-ink)}
.addbar{flex:1;min-height:60px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--surface);font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:.06em;text-transform:uppercase;min-width:0}
.addbar[disabled]{opacity:.35;cursor:not-allowed}
.addbar:not([disabled]):active{background:var(--ink);color:var(--on-ink)}
.home .nopo{grid-area:main/main/stats/stats}

/* ---------- defect screen ---------- */
.dscreen{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);border:1px solid var(--line);background:var(--panel)}
.shoe-pane{background:var(--panel);display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;padding:4px;border-right:1px solid var(--line)}
.shoe-pane svg{width:100%;height:100%;max-height:100%}
.side{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.ctx{padding:6px 10px 5px;border-bottom:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.ctx .po-line{font-size:12px;color:var(--ink-3);display:flex;gap:6px 12px;flex-wrap:wrap}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:26px}
.crumb{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;background:var(--surface);border:1px solid var(--line)}
.crumb.cur{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.crumbs i{color:var(--ink-3);font-style:normal}
.pick{flex:1 1 46%;overflow:auto;min-height:90px;border-bottom:1px solid var(--ink);background:var(--surface)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:7px 12px;border-bottom:1px solid var(--line-soft);font-size:16.5px;font-weight:600;text-transform:uppercase;line-height:1.15;overflow-wrap:anywhere;position:relative;transition:background .12s}
.opt .grow{flex:1;min-width:0}
.opt .sub{display:block;font-weight:400;text-transform:none;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.opt .n{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-3)}
.opt:active{background:var(--ink);color:var(--on-ink)}
.opt:active .sub,.opt:active .n{color:var(--on-ink)}
.opt.def{font-size:14.5px;font-weight:500;text-transform:none;padding-right:10px}
.opt .qty{font-family:var(--font-display);font-weight:700;font-size:17px;min-width:34px;text-align:center;padding:3px 4px 1px;background:var(--hit);color:#fff;border-radius:3px}
.opt.flash{animation:flash .5s ease-out}
@keyframes flash{0%{background:var(--hit-bg);box-shadow:inset 6px 0 0 var(--hit)}100%{background:transparent;box-shadow:inset 0 0 0 transparent}}
.empty-pick{height:100%;display:grid;place-content:center;gap:8px;text-align:center;padding:16px;color:var(--ink-3)}
.empty-pick b{font-family:var(--font-display);font-size:22px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.hist{flex:0 0 clamp(116px,30%,260px);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.hgrid{display:grid;grid-template-columns:32px minmax(0,1fr) auto 44px;align-items:center}
.hh{border-bottom:1px solid var(--ink);background:var(--surface-2);font-family:var(--font-display);font-weight:600;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
.hh>*{padding:4px 8px}
.hbody{flex:1;overflow:auto;min-height:0}
.hrow{border-bottom:1px solid var(--line-soft);min-height:40px}
.hrow>*{padding:5px 8px}
.hrow .nm{font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.hrow .nm small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.hrow .q{font-family:var(--font-display);font-weight:700;font-size:20px;text-align:right}
.hrow .no{color:var(--ink-3);font-size:12px}
.hrow.flash{animation:flash .6s ease-out}
.hempty{padding:14px;color:var(--ink-3);font-size:13px;text-align:center}
.bar{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);background:var(--surface)}
.bar button{min-height:58px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:27px;letter-spacing:.06em;text-transform:uppercase}
.bar button+button{border-left:1px solid var(--line)}
.bar button:active{background:var(--ink);color:var(--on-ink)}
.bar button[disabled]{opacity:.3}

/* shoe svg */
.pill rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;rx:7}
.pill text{font-family:var(--font-ui);font-weight:700;font-size:15.5px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;letter-spacing:.02em}
.pill{cursor:pointer}
.pill.sel rect{fill:var(--ink);stroke:var(--ink)}
.pill.sel text{fill:var(--on-ink)}
svg.off .pill,svg.off .zone{pointer-events:none}
svg.off .pill{opacity:.4}
svg.off .leader,svg.off .dot{opacity:.35}
.cmd{cursor:pointer}
.cmd rect{fill:var(--ink);rx:7}
.cmd text{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.05em;fill:var(--on-ink);text-anchor:middle;dominant-baseline:central}
.cmd.act rect{fill:var(--hit)}.cmd.act text{fill:#fff}
.cmd.dis{opacity:.28;pointer-events:none}
.cmd:active rect{opacity:.8}
.pill.gen rect{stroke-dasharray:5 4}
.pill .bd{fill:var(--hit);stroke:var(--surface);stroke-width:2}
.pill .bt,.pill.sel .bt{fill:#fff;font-size:12.5px;font-weight:700;font-family:var(--font-display);letter-spacing:0}
.leader{stroke:var(--ink-2);stroke-width:1.4;fill:none}
.leader.sel{stroke:var(--ink);stroke-width:2.2}
.dot{fill:var(--ink-2)}
.dot.sel{fill:var(--ink)}
.zone{fill:transparent;cursor:pointer}
.zone.sel{fill:var(--ink);fill-opacity:.34}
.zone.virt{stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:4 3}

function stats(po){
  const by={1:0,2:0,3:0}; let tot=0, bgFind=0;
  po.ent.forEach(x=>{ tot+=x.q; by[D[x.d].c]+=x.q; if(x.m==='BG') bgFind+=x.q });
  const insp=po.insp, b = B_GRADE_COUNT==='finding' ? bgFind : po.bg;
  return {tot, by, insp, a:po.a, b, rate: insp>0 ? tot/insp*100 : null, pass: insp>0 ? po.a/insp*100 : null};
}
function top5(po){
  const m = new Map();
  po.ent.forEach(x=>{ const r=m.get(x.d)||{d:x.d,q:0,areas:new Set()}; r.q+=x.q; r.areas.add(A[x.a].name); m.set(x.d,r) });
  return [...m.values()].sort((a,b)=>b.q-a.q || D[b.d].c-D[a.d].c).slice(0,5);
}

      // leave pill from the edge facing the anchor
      let sx=px, sy=py;
      if(Math.abs(ax-px)>Math.abs(ay-py)*1.2){ sx = ax>px? n.x+n.w : n.x; } else { sy = ay>py? n.y+h : n.y; }
      lines += `<path class="leader${on?' sel':''}" d="M${sx} ${sy} L${ax.toFixed(1)} ${ay.toFixed(1)}"/><circle class="dot${on?' sel':''}" cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${on?5:4}"/>`;

const canUndo = po=>!!(po.cur || po.lastAct==='ND');
function navLevel(){ const n=S.nav; return !n.a?0 : !n.s?1 : !n.f?2 : 3 }
const singleSub = a=>A[a].subs.length===1, singleFam = s=>SUB[s].fams.length===1;
function selectArea(a){
  const n={a,s:null,f:null};
  if(singleSub(a)) { n.s=A[a].subs[0].id; if(singleFam(n.s)) n.f=SUB[n.s].fams[0][0]; }
  S.nav=n;
}
function selectSub(s){ S.nav.s=s; S.nav.f = singleFam(s)? SUB[s].fams[0][0] : null }
function navUp(){
  const n=S.nav;
  if(n.f){ n.f=null; if(singleFam(n.s)){ n.s=null; if(singleSub(n.a)) n.a=null } return true }
  if(n.s){ n.s=null; if(singleSub(n.a)) n.a=null; return true }
  if(n.a){ n.a=null; return true }
  return false;
}
function ctxHTML(po){

    if(n.f && !singleFam(n.s)) parts.push({t:FAM[n.f], act:'crumb', v:'f'});

function pickHTML(po){
  const n=S.nav, lv=navLevel();
  if(!po.cur) return `<div class="empty-pick"><b>Mulai inspection</b><span>Pilih <strong>REWORK</strong>, <strong>B-GRADE</strong>, atau <strong>NO DEFECT</strong><br>untuk mengaktifkan area dan defect.</span></div>`;
  if(lv===0) return `<div class="empty-pick"><b>Pilih area sepatu</b><span>Sentuh salah satu area pada gambar sepatu.<br>Defect yang tercatat ditandai angka biru.</span></div>`;
  if(lv===1) return A[n.a].subs.map(s=>{
    const nd=s.fams.reduce((k,f)=>k+f[1].length,0), cnt=po.cur.log.filter(k=>k.split('|')[1]===s.id).length;

  if(lv===2) return SUB[n.s].fams.map(([f,ds])=>{

    return `<button class="opt" data-act="fam" data-v="${f}"><span class="grow">${esc(FAM[f])}</span>${cnt?`<span class="n" style="color:var(--hit)">×${cnt}</span>`:''}<span class="n">${ds.length}</span>${ICON.right}</button>`}).join('');
  const ds = SUB[n.s].fams.find(f=>f[0]===n.f)[1];
  return ds.map(id=>{
    const nq=po.cur.log.filter(k=>k===`${n.a}|${n.s}|${id}`).length;
    return `<button class="opt def" data-act="def" data-v="${id}" data-k="${n.a}|${n.s}|${id}"><span class="grow">${esc(D[id].n)}</span>${chip(D[id].c)}${nq?`<span class="qty num">${nq}</span>`:''}</button>`}).join('');
}
function histHTML(po){

function upd(parts, flashKey){
  const po=curPO();
  if(parts.includes('shoe')) $('#shoe').innerHTML=shoeSVG(po);
  if(parts.includes('ctx')) $('#ctx').innerHTML=ctxHTML(po);
  if(parts.includes('pick')){ const p=$('#pick'); const st=p.scrollTop; p.innerHTML=pickHTML(po); p.scrollTop = parts.includes('keepscroll')?st:0 }
  if(parts.includes('hist')){ const h=$('#hbody'); const st=h.scrollTop; h.innerHTML=histHTML(po); h.scrollTop=st;
    if(flashKey){ const r=[...h.children].find(c=>c.dataset&&c.dataset.key===flashKey); if(r){ r.classList.add('flash'); r.scrollIntoView({block:'nearest'}) } } }
  const u=$('#undoBtn'); if(u) u.disabled=!canUndo(po);
  save();
}
function addDefect(id){
  const po=curPO(), n=S.nav; if(!po.cur) return;
  const m=po.cur.m, key=n.a+'|'+n.s+'|'+id+'|'+m;
  const e=po.ent.find(x=>x.a===n.a&&x.s===n.s&&x.d===id&&x.m===m);
  if(e) e.q++; else po.ent.push({a:n.a,s:n.s,d:id,m,q:1});
  po.cur.log.push(n.a+'|'+n.s+'|'+id);
  try{ navigator.vibrate&&navigator.vibrate(18) }catch(e){}
  upd(['shoe','pick','keepscroll','hist'], key);
  const row=$(`#pick [data-k="${n.a}|${n.s}|${id}"]`); if(row){ row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash') }
  toast(m==='BG' ? '+1 Defect dan B-Grade' : '+1 Defect');
}
function undo(){
  const po=curPO();
  if(po.cur && po.cur.log.length){
    const [a,s,d]=po.cur.log.pop().split('|'), m=po.cur.m;
    const i=po.ent.findIndex(x=>x.a===a&&x.s===s&&x.d===d&&x.m===m);
    if(i>=0){ po.ent[i].q--; if(po.ent[i].q<=0) po.ent.splice(i,1) }
    upd(['shoe','pick','keepscroll','hist']); toast('Undo defect terakhir'); return;
  }
  if(po.cur){            // belum ada defect: batalkan inspection yang baru dimulai
    po.insp--; if(po.cur.m==='RW') po.rw--; else po.bg--;
    po.cur=null; S.nav={a:null,s:null,f:null}; render(); toast('Inspection dibatalkan'); return;
  }
  if(po.lastAct==='ND'){ po.insp--; po.a--; po.lastAct=null; render(); toast('No Defect dibatalkan') }
}
function startInsp(m){
  const po=curPO(); if(!po||po.cur) return;
  po.insp++; S.nav={a:null,s:null,f:null};
  if(m==='ND'){ po.a++; po.lastAct='ND'; render(); toast('No Defect tercatat. A-Grade +1'); return }
  if(m==='RW') po.rw++; else po.bg++;
  po.cur={m,log:[]}; po.lastAct=null; render(); toast('Inspection '+MODE[m]+' dimulai');
}
function endInsp(){
  const po=curPO(); if(!po||!po.cur) return;
  const n=po.cur.log.length; po.cur=null; S.nav={a:null,s:null,f:null}; render();
  toast(n?'Inspection selesai. '+n+' defect tercatat':'Inspection selesai tanpa defect');
}

        ${ui.poOpen?`<div class="ddpanel"><input id="poq" type="search" inputmode="numeric" placeholder="Cari PO, artikel, atau model" value="${esc(ui.poQ)}" autocomplete="off"><div class="ddlist">${list.length?list.map(p=>`<button class="ddopt" data-act="ddpick" data-v="${p.no}" ${have.has(p.no)?'disabled':''}><span class="mono">${p.no}</span><small>${esc(p.model)} · ${esc(p.dest)}${have.has(p.no)?' · sudah di list':''}</small></button>`).join(''):'<div class="hempty">PO tidak ditemukan</div>'}</div></div>`:''}</div>
      <div class="info-grid">${[['PO Number',sel&&sel.no],['Artikel',sel&&sel.art],['Model',sel&&sel.model],['Destination',sel&&sel.dest],['Qty Order',sel&&nf(sel.qty)],['PODD',sel&&fmtDate(sel.podd)],['CRD',sel&&fmtDate(sel.crd)]].map(([k,v])=>`<div><span class="k">${k}</span><b>${v?esc(v):'<span style="color:var(--ink-3);font-weight:400">:</span>'}</b></div>`).join('')}</div>
      <button class="btn" data-act="addpo-ok" ${sel?'':'disabled'}>Add to PO List</button>
    </div></div></div>`;
}

/* ====== PHOTOS ====== */
function toDataURL(file,max=960){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.72)) };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))}; img.src=url;
  });
}
document.addEventListener('change', async e=>{
  if(e.target.id!=='photoIn') return;
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f||!ui.photoKey) return;
  try{ const po=curPO(); P[po.no+'|'+ui.photoKey]=await toDataURL(f); savePhotos(); ui.modal=null; render(); toast('Foto tersimpan') }
  catch(err){ toast('Foto tidak bisa dibaca. Coba ambil ulang.',true) }
});

/* ====== EXPORT ====== */
const stamp = ()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())};
const nowText = ()=>new Date().toLocaleString('id-ID');
function rowsFor(po){
  return po.ent.map((x,i)=>[i+1, MODE[x.m], A[x.a].name, SUB[x.s].name, FAM[D[x.d].f], D[x.d].n, CLSN[D[x.d].c], x.q]);
}
async function saveFile(filename, data){
  let dl=null; try{ dl = window.claude && claude.use ? await claude.use('downloads') : null }catch(e){}
  if(!dl){ toast('Download tidak tersedia di tampilan ini. Buka artifact di claude.ai.',true); return }
  try{ await dl.save({filename, data}); toast('File dikirim: '+filename) }
  catch(err){ if(err&&err.code==='declined') return; toast('Gagal menyimpan file ('+(err&&err.code||'error')+')',true) }
}
function exportXlsx(po){
  if(!window.XLSX){ toast('Library Excel belum termuat. Cek koneksi lalu coba lagi.',true); return }
  const st=stats(po), wb=XLSX.utils.book_new();
  const sum=[['MOBILE 100% INSPECTION - INSPECTION RESULT'],[],
    ['PO Number',po.no],['Artikel',po.art],['Model',po.model],['Destination',po.dest],['Factory/Cell',S.login.factory+'-'+S.login.cell],
    ['Inspector',S.user.name+' ('+S.user.nik+', '+ROLE[S.user.role]+')'],['Dicetak',nowText()],[],
    ['Qty PO Order',po.qty],['Qty Inspection',st.insp],['Qty Defect',st.tot],['Qty A-Grade',st.a],['Qty B-Grade',st.b],['Defect Rate (%)',st.rate==null?'':+st.rate.toFixed(2)],['Pass Rate / RFT (%)',st.pass==null?'':+st.pass.toFixed(2)],
    ['Minor',st.by[1]],['Major',st.by[2]],['Critical',st.by[3]],[],['TOP 5 DEFECT'],['No','Defect','Kelas','Qty','Foto']];
  top5(po).forEach((r,i)=>sum.push([i+1,D[r.d].n,CLSN[D[r.d].c],r.q,P[po.no+'|'+r.d]?'Ada':'-']));
  const w1=XLSX.utils.aoa_to_sheet(sum); w1['!cols']=[{wch:22},{wch:70},{wch:12},{wch:8},{wch:8}];
  const det=[['No','Tipe inspection','Area','Sub area','Defect family','Defect','Kelas','Qty'],...rowsFor(po)];
  const w2=XLSX.utils.aoa_to_sheet(det); w2['!cols']=[{wch:5},{wch:16},{wch:20},{wch:26},{wch:28},{wch:90},{wch:10},{wch:6}];
  XLSX.utils.book_append_sheet(wb,w1,'Summary'); XLSX.utils.book_append_sheet(wb,w2,'Defects');
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  return saveFile(`M100_${po.no}_${stamp()}.xlsx`, buf);
}
function exportPdf(po){
  if(!window.jspdf){ toast('Library PDF belum termuat. Cek koneksi lalu coba lagi.',true); return }
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'mm',format:'a4'}), st=stats(po), W=210, M=14;
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('MOBILE 100% INSPECTION - INSPECTION RESULT',M,18);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text('Dicetak '+nowText()+' oleh '+S.user.name+' ('+S.user.nik+', '+ROLE[S.user.role]+')',M,24); doc.setTextColor(0);
  doc.autoTable({startY:29, theme:'grid', styles:{fontSize:9,cellPadding:1.8}, headStyles:{fillColor:[14,18,23]}, margin:{left:M,right:M},
    head:[['PO Number','Artikel','Model','Destination','Factory/Cell']], body:[[po.no,po.art,po.model,po.dest,S.login.factory+'-'+S.login.cell]]});
  doc.autoTable({startY:doc.lastAutoTable.finalY+4, theme:'grid', styles:{fontSize:9,cellPadding:1.8,halign:'center'}, headStyles:{fillColor:[14,18,23]}, margin:{left:M,right:M},
    head:[['Qty PO Order','Qty Inspection','Qty Defect','Qty A-Grade','Qty B-Grade','Defect Rate','Pass Rate (RFT)']],
    body:[[nf(po.qty),st.insp,st.tot,st.a,st.b,st.rate==null?'-':st.rate.toFixed(1)+'%',st.pass==null?'-':st.pass.toFixed(1)+'%']]});
  const t5=top5(po);
  doc.autoTable({startY:doc.lastAutoTable.finalY+8, theme:'grid', styles:{fontSize:8.5,cellPadding:1.8}, headStyles:{fillColor:[14,18,23]}, margin:{left:M,right:M},
    columnStyles:{0:{cellWidth:9},2:{cellWidth:20},3:{cellWidth:12,halign:'center'}},
    head:[['No','TOP 5 DEFECT','Kelas','Qty']], body:t5.map((r,i)=>[i+1,D[r.d].n,CLSN[D[r.d].c],r.q])});
  let y=doc.lastAutoTable.finalY+8; const withImg=t5.map((r,i)=>({r,i,img:P[po.no+'|'+r.d]})).filter(x=>x.img);
  if(withImg.length){
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('Foto bukti Top 5 Defect',M,y); y+=4;
    let x=M; const w=58,h=43;
    withImg.forEach(o=>{
      if(x+w>W-M+1){ x=M; y+=h+14 }
      if(y+h+10>285){ doc.addPage(); y=16; x=M }
      try{ doc.addImage(o.img,'JPEG',x,y,w,h) }catch(e){}
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.text(doc.splitTextToSize((o.i+1)+'. '+D[o.r.d].n,w).slice(0,2),x,y+h+3.5);
      x+=w+4;
    });
    y+=h+14;
  }
  doc.autoTable({startY:Math.min(y,270), theme:'striped', styles:{fontSize:7.5,cellPadding:1.5}, headStyles:{fillColor:[14,18,23]}, margin:{left:M,right:M},
    columnStyles:{0:{cellWidth:8},1:{cellWidth:15},6:{cellWidth:16},7:{cellWidth:9,halign:'center'}},
    head:[['No','Tipe','Area','Sub area','Family','Defect','Kelas','Qty']], body:rowsFor(po)});
  const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text('Halaman '+i+' / '+n,W-M,291,{align:'right'}) }
  return saveFile(`M100_${po.no}_${stamp()}.pdf`, doc.output('arraybuffer'));
}

/* ====== EVENTS ====== */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act, v=t.dataset.v;
  if(t.classList.contains('scrim') && e.target!==t) return;       // backdrop click only
  if(act==='closeov' && t.classList.contains('scrim')===false && e.target.closest('.modal') && t.tagName!=='BUTTON') return;
  switch(act){
    case 'sheet': ui.sheet=v; renderOverlay(); break;
    case 'opt': { S.login[t.dataset.f]=t.dataset.f==='cell'?Number(v):v; ui.sheet=null; render(); break }
    case 'login': { const u=USERS.find(x=>x.nik===S.login.nik); if(!u||!S.login.factory||!S.login.cell) break; S.user=u; S.screen='home'; render(); break }
    case 'closeov': ui.sheet=null; ui.modal=null; ui.menu=false; ui.poOpen=false; ui.poQ=''; renderOverlay(); break;
    case 'menu': ui.menu=!ui.menu; renderOverlay(); break;
    case 'logout': ui.menu=false; S.user=null; S.screen='login'; S.login={nik:null,factory:null,cell:null}; render(); break;
    case 'reset': { const keep=S.user, lg=S.login; try{localStorage.removeItem(KEY);localStorage.removeItem(KEYP)}catch(e){} P={}; S=seed(); S.user=keep; S.login=lg; S.screen='home'; ui.menu=false; render(); toast('Data demo dikembalikan'); break }
    case 'selpo': S.activePo=v; render(); break;
    case 'addpo': ui.modal='addpo'; ui.poOpen=false; ui.poQ=''; ui.poSel=null; renderOverlay(); break;
    case 'ddtoggle': ui.poOpen=!ui.poOpen; renderOverlay(); if(ui.poOpen){ const q=$('#poq'); q&&q.focus() } break;
    case 'ddpick': ui.poSel=v; ui.poOpen=false; ui.poQ=''; renderOverlay(); break;
    case 'addpo-ok': { const m=PO_MASTER.find(p=>p.no===ui.poSel); if(!m) break; if(!S.pos.some(p=>p.no===m.no)) S.pos.push(newPO(m)); S.activePo=m.no; ui.modal=null; render(); toast('PO ditambahkan'); break }
    case 'inspstart': startInsp(v); break;
    case 'inspend': endInsp(); break;
    case 'adddefect': S.nav={a:null,s:null,f:null}; S.screen='defect'; render(); break;
    case 'home': S.screen='home'; S.nav={a:null,s:null,f:null}; render(); break;
    case 'back': if(!navUp()){ S.screen='home'; render() } else upd(['ctx','pick']); break;
    case 'undo': undo(); break;
    case 'area': if(!curPO().cur) break; selectArea(v); upd(['shoe','ctx','pick']); break;
    case 'sub': selectSub(v); upd(['ctx','pick']); break;
    case 'fam': S.nav.f=v; upd(['ctx','pick']); break;
    case 'def': addDefect(v); break;
    case 'crumb': { const n=S.nav; if(v==='a') selectArea(n.a); else if(v==='s'){ const s=n.s; selectArea(n.a); if(!singleSub(n.a)) selectSub(s) } upd(['ctx','pick']); break }
    case 'photo': ui.photoKey=v; $('#photoIn').click(); break;
    case 'photoview': ui.photoKey=v; ui.modal='photo'; renderOverlay(); break;
    case 'photodel': { const po=curPO(); delete P[po.no+'|'+v]; savePhotos(); ui.modal=null; render(); break }
    case 'export': {
      const po=curPO(); if(!po) break;
      if(!po.ent.length){ toast('Belum ada defect untuk diexport',true); break }
      if(can.mustPhoto() && top5(po).some(r=>!P[po.no+'|'+r.d])){ ui.modal='block'; renderOverlay(); break }
      (v==='pdf'?exportPdf(po):exportXlsx(po)); break }
  }
});
document.addEventListener('input', e=>{ if(e.target.id==='poq'){ ui.poQ=e.target.value; renderOverlay() } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && (ui.sheet||ui.modal||ui.menu)){ ui.sheet=null; ui.modal=null; ui.menu=false; renderOverlay() }
  if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('g.pill, g.cmd')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})) }
});
render();
</script>
