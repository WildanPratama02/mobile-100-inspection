# Same values as deploy/security-headers.json (deploy/test checks it). Included in every location of m100.conf,
# because an add_header inside a location replaces all add_header of the server level.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; connect-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# HSTS only after HTTPS is stable (doc 03 section 6); after that this name can never go back to HTTP.
# add_header Strict-Transport-Security "max-age=31536000" always;
