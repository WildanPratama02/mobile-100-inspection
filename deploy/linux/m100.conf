# PSI Inspection Report: Nginx server block (CentOS Stream 10, nginx 1.26).
# Installed by install.sh as /etc/nginx/conf.d/m100.conf. Other server blocks are not touched.
#
#   /          PWA for the tablets (static, /opt/m100/current/web)
#   /admin/    admin web app (static, /opt/m100/current/admin)
#   /v1/       NestJS API on 127.0.0.1:3110 (systemd m100-api)
#
# If PORT in /opt/m100/.env is not 3110, change the upstream too.

upstream m100_api {
    server 127.0.0.1:3110;
    keepalive 16;
}

# Plain HTTP only redirects to HTTPS (tablets always open https://).
server {
    listen 80;
    server_name m100.qdms.web.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name m100.qdms.web.id;

    ssl_certificate     /etc/letsencrypt/live/m100.qdms.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m100.qdms.web.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # One Submit PO: up to 98 photos plus JSON, 100 MB (CLAUDE.md rule 6). nginx's default is 1 MB.
    client_max_body_size 100m;

    # API: loopback only, never cached, the /v1 prefix is kept.
    location /v1/ {
        include snippets/m100-headers.conf;
        add_header Cache-Control "no-store" always;

        proxy_pass http://m100_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwritten, not appended: the API trusts this proxy and rate-limits per client IP.
        proxy_set_header X-Forwarded-For $remote_addr;

        client_body_timeout 120s;
        proxy_read_timeout  120s;            # above SUBMIT_TIMEOUT_SECONDS (60)
        proxy_send_timeout  120s;
    }

    location = /admin { return 308 /admin/; }

    # Admin app: online only, no service worker.
    location /admin/assets/ {
        root /opt/m100/current;
        include snippets/m100-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /admin/ {
        root /opt/m100/current;
        include snippets/m100-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /admin/index.html;
    }

    # Tablet PWA. Hashed files in /assets/ never change; the rest (index.html, sw.js, manifest, icons, app routes)
    # is always revalidated so a new release reaches the tablets.
    location /assets/ {
        root /opt/m100/current/web;
        include snippets/m100-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        root /opt/m100/current/web;
        include snippets/m100-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
