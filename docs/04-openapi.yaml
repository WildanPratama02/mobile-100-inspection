openapi: 3.1.0
info:
  title: Mobile 100% Inspection API
  version: 2.0.0
  summary: Backend for the Mobile 100% Inspection PWA (PT Parkland World Indonesia, QIP Digital Team).
  description: |
    Contract between the tablet PWA and the NestJS API. Behaviour, rules and examples are in
    `04-api-contract.md`; database schema in `02-data-design.md` (PostgreSQL, ADR-018). Tablet endpoints
    first, then the `/admin` endpoints used by the admin web app.
    All times are ISO 8601 with offset +07:00 (WIB). All errors use `application/problem+json`.
servers:
  - url: https://{host}/v1
    variables:
      host:
        default: m100.qdms.web.id
        description: Decided in doc 03 (hosting, PRD OQ-03).
tags:
  - name: system
  - name: auth
  - name: master-data
  - name: po
  - name: submissions
  - name: admin
security:
  - deviceKey: []
    bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe. No authentication.
      security: []
      responses:
        '200':
          description: The API process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Whether Submit PO is currently possible (readiness checks, doc 02 §10).
      security:
        - deviceKey: []
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log a PSI in by name, factory and cell (ADR-006). Returns a bearer token.
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Exchange a valid token that is close to expiry for a new one.
      description: Also accepts a token of the same device that expired less than 30 days ago; the new token has the same claims and lives 30 days. Older tokens get TOKEN_INVALID (doc 04 §10 A7).
      responses:
        '200':
          description: New token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /master-data:
    get:
      tags: [master-data]
      operationId: getMasterData
      summary: Users, factories/cells and the area map in one cacheable document (FR-13).
      description: Needed before login, so only the device key is required. Supports ETag.
      security:
        - deviceKey: []
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
          required: false
      responses:
        '200':
          description: Current master data.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterData' }
        '304':
          description: Unchanged since the given ETag.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /pos:
    get:
      tags: [po]
      operationId: searchPos
      summary: Search ALL_PO_MASTER by PO, article or model (FR-03).
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 3, maxLength: 40 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Up to `limit` matches.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/Po' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /pos/{po}:
    get:
      tags: [po]
      operationId: getPo
      summary: One PO by its exact number.
      parameters:
        - in: path
          name: po
          required: true
          schema: { type: string }
          description: URL-encoded, leading zeros and prefixes kept (`0903359388`, `CX-0902368685`).
      responses:
        '200':
          description: The PO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Po' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /submissions:
    post:
      tags: [submissions]
      operationId: createSubmission
      summary: Submit a sealed session (FR-11). Idempotent by `submissionUuid`.
      description: |
        `multipart/form-data` with one JSON part `submission` and zero or more photo parts.
        Each photo part's name is `photo_<DEFECT_ID>` (for example `photo_D035`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [submission]
              properties:
                submission:
                  $ref: '#/components/schemas/SubmissionRequest'
              additionalProperties:
                type: string
                contentMediaType: image/jpeg
                description: Photo parts named `photo_<DEFECT_ID>`.
            encoding:
              submission:
                contentType: application/json
      responses:
        '201':
          description: Written to the database now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionResult' }
        '200':
          description: This UUID was already written earlier; same result returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  # ---------------------------------------------------------------- admin (doc 04 section 8)
  /admin/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Admin login; sets the HttpOnly session cookie (8 hours).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '204': { description: Logged in; cookie set. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { description: Account locked for 10 minutes after 5 failures (ADMIN_LOCKED). }
  /admin/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      security: [{ adminCookie: [] }]
      responses:
        '204': { description: Logged out. }
  /admin/me:
    get:
      tags: [admin]
      operationId: adminMe
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: The signed-in admin.
          content:
            application/json:
              schema: { type: object, properties: { username: { type: string }, lastLoginAt: { type: string, format: date-time } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/psi-users:
    get:
      tags: [admin]
      operationId: adminListPsiUsers
      security: [{ adminCookie: [] }]
      responses:
        '200': { description: All PSI users including inactive., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminPsiUser' } } } } }
    post:
      tags: [admin]
      operationId: adminCreatePsiUser
      security: [{ adminCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPsiUserInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/AdminPsiUser' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/psi-users/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdatePsiUser
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPsiUserInput' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/AdminPsiUser' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/pos:
    get:
      tags: [admin]
      operationId: adminSearchPos
      security: [{ adminCookie: [] }]
      parameters: [{ in: query, name: q, schema: { type: string } }]
      responses:
        '200': { description: Up to 50 POs., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Po' } } } } }
  /admin/pos/import:
    post:
      tags: [admin]
      operationId: adminImportPos
      summary: Upload a CSV or XLSX of POs; upsert by `po`, never delete.
      security: [{ adminCookie: [] }]
      parameters: [{ in: query, name: dryRun, schema: { type: boolean, default: true } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: Import report., content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } } }
        '422': { description: IMPORT_INVALID with row errors., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/area-map/import:
    post:
      tags: [admin]
      operationId: adminImportAreaMap
      summary: Upload the mapping workbook (doc 02 section 5.1).
      security: [{ adminCookie: [] }]
      parameters: [{ in: query, name: dryRun, schema: { type: boolean, default: true } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: Import report., content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } } }
        '422': { description: IMPORT_INVALID., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/submissions:
    get:
      tags: [admin]
      operationId: adminListSubmissions
      security: [{ adminCookie: [] }]
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: factory, schema: { type: string } }
        - { in: query, name: cell, schema: { type: string } }
        - { in: query, name: username, schema: { type: string } }
        - { in: query, name: po, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
      responses:
        '200': { description: A page of submissions., content: { application/json: { schema: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/AdminSubmissionSummary' } } } } } } }
  /admin/submissions/{id}:
    get:
      tags: [admin]
      operationId: adminGetSubmission
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Submission with findings and photo ids., content: { application/json: { schema: { $ref: '#/components/schemas/AdminSubmissionSummary' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/photos/{id}:
    get:
      tags: [admin]
      operationId: adminGetPhoto
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        '200': { description: The JPEG., content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Per-tablet key provisioned at install. Identifies the tablet; revocable.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminCookie:
      type: apiKey
      in: cookie
      name: m100_admin
      description: 'HttpOnly session cookie from POST /admin/auth/login. State-changing requests also send header X-Requested-With = m100-admin.'

  responses:
    Unauthorized:
      description: Missing or invalid device key or token. Codes DEVICE_KEY_INVALID, TOKEN_INVALID, TOKEN_EXPIRED.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Codes PO_NOT_FOUND, NOT_FOUND.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Code SUBMISSION_UUID_REUSED (same UUID, different content).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooLarge:
      description: Code PAYLOAD_TOO_LARGE (request over 8 MB or a photo over 1 MB).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: The request breaks a rule; `errors` lists each one. Not retryable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Code RATE_LIMITED. Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Codes SUBMIT_DISABLED, DB_UNAVAILABLE, PHOTO_STORE_UNAVAILABLE. Retryable.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    PsiLevel:
      type: string
      enum: [PSI lv.1, PSI lv.2]
    InspectionType:
      type: string
      enum: [REWORK, B-GRADE]
    Classification:
      type: string
      enum: [MINOR, MAJOR, CRITICAL]
    DefectId:
      type: string
      pattern: '^D0(0[1-9]|[1-8][0-9]|9[0-8])$'
    AreaId:
      type: string
      pattern: '^A(0[1-9]|1[0-2])$'

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ['https://m100/errors/validation-failed'] }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - DEVICE_KEY_INVALID
            - TOKEN_INVALID
            - TOKEN_EXPIRED
            - USER_NOT_FOUND
            - CELL_NOT_FOUND
            - PO_NOT_FOUND
            - SUBMISSION_UUID_REUSED
            - VALIDATION_FAILED
            - PHOTO_MISSING
            - PHOTO_NOT_ALLOWED
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - SUBMIT_DISABLED
            - DB_UNAVAILABLE
            - PHOTO_STORE_UNAVAILABLE
            - ADMIN_AUTH_REQUIRED
            - ADMIN_LOGIN_FAILED
            - ADMIN_LOCKED
            - NOT_FOUND
            - CONFLICT
            - IMPORT_INVALID
            - INTERNAL
        detail: { type: string, description: 'Indonesian, ready to show to the PSI.' }
        retryable: { type: boolean }
        errors:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: { type: string, examples: ['findings[2].qty'] }
              code: { type: string }
              message: { type: string }

    SystemStatus:
      type: object
      required: [submitEnabled, checkedAt, checks]
      properties:
        submitEnabled: { type: boolean }
        checkedAt: { type: string, format: date-time }
        masterDataVersion: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [id, ok]
            properties:
              id: { type: string, examples: [DB, MASTER_DATA, PHOTO_STORE, SUBMIT_ENABLED] }
              ok: { type: boolean }
              message: { type: string }

    LoginRequest:
      type: object
      required: [username, level, factory, cell]
      properties:
        username: { type: string, examples: ['AZIZAH'] }
        level: { $ref: '#/components/schemas/PsiLevel' }
        factory: { type: string, examples: ['F 3'] }
        cell: { type: string, examples: ['F3-10'] }

    User:
      type: object
      required: [username, level]
      properties:
        username: { type: string }
        level: { $ref: '#/components/schemas/PsiLevel' }

    LoginResponse:
      type: object
      required: [token, expiresAt, user, factory, cell]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        factory: { type: string }
        cell: { type: string }

    MasterData:
      type: object
      required: [version, fetchedAt, users, factories, areas, families, defects, map]
      properties:
        version: { type: string, description: 'Same value as the ETag.' }
        fetchedAt: { type: string, format: date-time }
        users:
          type: array
          items: { $ref: '#/components/schemas/User' }
        factories:
          type: array
          description: Only `F <number>` factories (doc 02 §3.2).
          items:
            type: object
            required: [factory, cells]
            properties:
              factory: { type: string, examples: ['F 3'] }
              cells:
                type: array
                items: { type: string, examples: ['F3-10'] }
        areas:
          type: array
          items:
            type: object
            required: [id, name, order, subAreas]
            properties:
              id: { $ref: '#/components/schemas/AreaId' }
              name: { type: string }
              order: { type: integer }
              subAreas:
                type: array
                items:
                  type: object
                  required: [id, name, order]
                  properties:
                    id: { type: string, examples: ['SA03L'] }
                    name: { type: string }
                    order: { type: integer }
        families:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, examples: ['F03'] }
              name: { type: string }
        defects:
          type: array
          items:
            type: object
            required: [id, name, classification, familyId]
            properties:
              id: { $ref: '#/components/schemas/DefectId' }
              name: { type: string }
              classification: { $ref: '#/components/schemas/Classification' }
              familyId: { type: string }
        map:
          type: array
          description: Active rows of M100_AREA_MAP.
          items:
            type: object
            required: [mapId, areaId, subAreaId, familyId, defectId]
            properties:
              mapId: { type: string }
              areaId: { $ref: '#/components/schemas/AreaId' }
              subAreaId: { type: string }
              familyId: { type: string }
              defectId: { $ref: '#/components/schemas/DefectId' }

    Po:
      type: object
      required: [po, article, model, destination, orderQty, podd, crd]
      properties:
        po: { type: string, examples: ['0903359388'] }
        article: { type: string }
        model: { type: string, description: 'Byte for byte from ALL_PO_MASTER (may contain U+00A0).' }
        destination: { type: string }
        orderQty: { type: integer }
        podd: { type: [string, 'null'], format: date }
        crd: { type: [string, 'null'], format: date }

    Finding:
      type: object
      description: One area + sub-area + defect + inspection type, with its total quantity.
      required: [inspectionType, areaId, subAreaId, defectId, qty, firstRecordedAt]
      properties:
        inspectionType: { $ref: '#/components/schemas/InspectionType' }
        areaId: { $ref: '#/components/schemas/AreaId' }
        subAreaId: { type: string }
        familyId: { type: string }
        defectId: { $ref: '#/components/schemas/DefectId' }
        qty: { type: integer, minimum: 1 }
        firstRecordedAt: { type: string, format: date-time, description: 'Breaks ties in slot order (doc 02 §6.2).' }

    SubmissionRequest:
      type: object
      required: [submissionUuid, sealedAt, appVersion, user, factory, cell, po, counts, findings]
      properties:
        submissionUuid: { type: string, format: uuid }
        sealedAt: { type: string, format: date-time }
        appVersion: { type: string, examples: ['1.0.0'] }
        user: { $ref: '#/components/schemas/User' }
        factory: { type: string }
        cell: { type: string }
        po: { type: string }
        partial:
          type: [object, 'null']
          description: PO PARTIAL (ADR-013); null when the PO isn't partial.
          required: [number, qty]
          properties:
            number: { type: integer, minimum: 1, maximum: 99, description: 'Partial number: 1 = P1.' }
            qty: { type: integer, minimum: 1 }
        counts:
          type: object
          description: Number of inspections started, by type (ADR-008).
          required: [rework, bGrade, noDefect]
          properties:
            rework: { type: integer, minimum: 0 }
            bGrade: { type: integer, minimum: 0 }
            noDefect: { type: integer, minimum: 0 }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        photos:
          type: array
          description: One entry per photo part. PSI lv.2 only, one per defect (ADR-011).
          items:
            type: object
            required: [defectId, part, sha256]
            properties:
              defectId: { $ref: '#/components/schemas/DefectId' }
              part: { type: string, examples: ['photo_D035'] }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    SubmissionResult:
      type: object
      required: [submissionUuid, status]
      properties:
        submissionUuid: { type: string, format: uuid }
        status:
          type: string
          enum: [written]
        displayNo: { type: string, examples: ['M100-000123'], description: 'Human number of the submission (doc 02 section 4.1).' }
        writtenAt: { type: string, format: date-time }
        totals:
          type: object
          properties:
            qtyInspection: { type: integer }
            qtyAGrade: { type: integer }
            qtyBGrade: { type: integer }
            qtyDefect: { type: integer }
            rft: { type: number }
            defectRate: { type: number }

    AdminPsiUser:
      type: object
      required: [id, username, level, active]
      properties:
        id: { type: integer }
        username: { type: string }
        level: { $ref: '#/components/schemas/PsiLevel' }
        active: { type: boolean }
    AdminPsiUserInput:
      type: object
      properties:
        username: { type: string }
        level: { $ref: '#/components/schemas/PsiLevel' }
        active: { type: boolean }
    ImportReport:
      type: object
      required: [dryRun, read, inserted, updated, skipped]
      properties:
        dryRun: { type: boolean }
        read: { type: integer }
        inserted: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items: { type: object, properties: { row: { type: integer }, message: { type: string } } }
    AdminSubmissionSummary:
      type: object
      required: [id, displayNo, sealedAt, username, level, po]
      properties:
        id: { type: string, format: uuid }
        displayNo: { type: string }
        sealedAt: { type: string, format: date-time }
        username: { type: string }
        level: { $ref: '#/components/schemas/PsiLevel' }
        factory: { type: string }
        cell: { type: string }
        po: { type: string }
        partialText: { type: [string, 'null'], examples: ['P1 1.200 OF 10.002'] }
        qtyInspection: { type: integer }
        qtyDefect: { type: integer }
        qtyAGrade: { type: integer }
        qtyBGrade: { type: integer }
        rft: { type: number }
        defectRate: { type: number }
        photoCount: { type: integer }
        findings:
