openapi: 3.1.0
info:
  title: Mobile 100% Inspection API
  version: 2.0.0
  summary: Backend for the Mobile 100% Inspection PWA (PT Parkland World Indonesia, QIP Digital Team).
  description: |
    Contract between the tablet PWA and the NestJS API. Behaviour, rules and examples are in
    `04-api-contract.md`; database schema in `02-data-design.md` (PostgreSQL, ADR-018). Tablet endpoints
    first, then the `/admin` endpoints used by the admin web app.
    All times are ISO 8601 with offset +07:00 (WIB). All errors use `application/problem+json`.
servers:
  - url: https://{host}/v1
    variables:
      host:
        default: m100.qdms.web.id
        description: Decided in doc 03 (hosting, PRD OQ-03).
tags:
  - name: system
  - name: auth
  - name: master-data
  - name: po
  - name: submissions
  - name: admin
security:
  - deviceKey: []
    bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe. No authentication.
      security: []
      responses:
        '200':
          description: The API process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Whether Submit PO is currently possible (readiness checks, doc 02 §10).
      security:
        - deviceKey: []
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log a PSI in by name, factory and cell (ADR-006). Returns a bearer token.
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Exchange a valid token that is close to expiry for a new one.
      description: Also accepts a token of the same device that expired less than 30 days ago; the new token has the same claims and lives 30 days. Older tokens get TOKEN_INVALID (doc 04 §10 A7).
      responses:
        '200':
          description: New token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /master-data:
    get:
      tags: [master-data]
      operationId: getMasterData
      summary: Users, factories/cells and the area map in one cacheable document (FR-13).
      description: Needed before login, so only the device key is required. Supports ETag.
      security:
        - deviceKey: []
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
          required: false
      responses:
        '200':
          description: Current master data.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterData' }
        '304':
          description: Unchanged since the given ETag.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /pos:
    get:
      tags: [po]
      operationId: searchPos
      summary: Search ALL_PO_MASTER by PO, article or model (FR-03).
      description: >-
        Active POs only. `q` is trimmed, then matched case-insensitively inside `po`, `article` or `model`.
        Order (doc 04 §10 A8): `po` ends with `q`, then `po` contains `q`, then article/model matches; within each,
        newest PODD first (null last), then `po`.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 3, maxLength: 40 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Up to `limit` matches.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/Po' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /pos/{po}:
    get:
      tags: [po]
      operationId: getPo
      summary: One PO by its exact number.
      description: An unknown or deactivated PO is PO_NOT_FOUND.
      parameters:
        - in: path
          name: po
          required: true
          schema: { type: string }
          description: URL-encoded, leading zeros and prefixes kept (`0903359388`, `CX-0902368685`).
      responses:
        '200':
          description: The PO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Po' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /submissions:
    post:
      tags: [submissions]
      operationId: createSubmission
      summary: Submit a sealed session (FR-11). Idempotent by `submissionUuid`.
      description: |
        `multipart/form-data` with one JSON part `submission` and zero or more photo parts.
        Each photo part's name is `photo_<DEFECT_ID>` (for example `photo_D035`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [submission]
              properties:
                submission:
                  $ref: '#/components/schemas/SubmissionRequest'
              additionalProperties:
                type: string
                contentMediaType: image/jpeg
                description: Photo parts named `photo_<DEFECT_ID>`.
            encoding:
              submission:
                contentType: application/json
      responses:
        '201':
          description: Written to the database now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionResult' }
        '200':
          description: This UUID was already written earlier; same result returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  # ---------------------------------------------------------------- admin (doc 04 section 8)
  /admin/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Admin login; sets the HttpOnly session cookie (8 hours).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '204': { description: 'Logged in; cookie set: m100_admin=<JWT, aud admin>; Max-Age=28800; Path=/v1/admin; HttpOnly; Secure; SameSite=Strict.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '423': { $ref: '#/components/responses/AdminLocked' }
  /admin/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      security: [{ adminCookie: [] }]
      responses:
        '204': { description: Logged out; the cookie is cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/me:
    get:
      tags: [admin]
      operationId: adminMe
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: The signed-in admin.
          content:
            application/json:
              schema: { type: object, properties: { username: { type: string }, lastLoginAt: { type: string, format: date-time } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/me/password:
    post:
      tags: [admin]
      operationId: adminChangeOwnPassword
      summary: The signed-in admin's own password; a wrong current password counts as a failed login.
      security: [{ adminCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 10 }
      responses:
        '204': { description: Password changed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '423': { $ref: '#/components/responses/AdminLocked' }
  /admin/psi-users:
    get:
      tags: [admin]
      operationId: adminListPsiUsers
      security: [{ adminCookie: [] }]
      responses:
        '200': { description: All PSI users including inactive, by username then level., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminPsiUser' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      operationId: adminCreatePsiUser
      security: [{ adminCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPsiUserCreate' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/AdminPsiUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/psi-users/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdatePsiUser
      summary: Rename, change level, deactivate or reactivate. A change that changes nothing writes nothing.
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPsiUserInput' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/AdminPsiUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/factories:
    get:
      tags: [admin]
      operationId: adminListFactories
      security: [{ adminCookie: [] }]
      responses:
        '200': { description: All factories including inactive, in the order they were added., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminFactory' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      operationId: adminCreateFactory
      security: [{ adminCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 50 } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/AdminFactory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/factories/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdateFactory
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { type: string, minLength: 1, maxLength: 50 }, active: { type: boolean } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/AdminFactory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/cells:
    get:
      tags: [admin]
      operationId: adminListCells
      security: [{ adminCookie: [] }]
      parameters: [{ in: query, name: factoryId, schema: { type: integer } }]
      responses:
        '200': { description: All cells including inactive (only those of factoryId when given), in the order they were added., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminCell' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [admin]
      operationId: adminCreateCell
      security: [{ adminCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [factoryId, code], properties: { factoryId: { type: integer }, code: { type: string, minLength: 1, maxLength: 50 } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/AdminCell' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/cells/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdateCell
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, minProperties: 1, properties: { factoryId: { type: integer }, code: { type: string, minLength: 1, maxLength: 50 }, active: { type: boolean } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/AdminCell' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/pos:
    get:
      tags: [admin]
      operationId: adminSearchPos
      summary: The match and order of GET /pos (doc 04 section 3.3) over every PO, inactive included.
      security: [{ adminCookie: [] }]
      parameters: [{ in: query, name: q, required: true, schema: { type: string, minLength: 3, maxLength: 40 } }]
      responses:
        '200': { description: Up to 50 POs., content: { application/json: { schema: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/AdminPo' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [admin]
      operationId: adminCreatePo
      summary: Add one PO (`source` = `admin`). `finished` is not set here (PRD OQ-06).
      security: [{ adminCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPoCreate' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/AdminPo' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/pos/{po}:
    patch:
      tags: [admin]
      operationId: adminUpdatePo
      summary: Edit one PO, or deactivate / reactivate it. The PO number cannot change; a changed value sets `source` to `admin`.
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: po, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPoInput' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/AdminPo' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/pos/import:
    post:
      tags: [admin]
      operationId: adminImportPos
      summary: Upload a CSV or XLSX of POs; upsert by `po`, never delete.
      description: |
        Columns PO, ARTICLE, MODEL, DESTINATION, ORDER QTY, PODD, CRD (header names ignore case and surrounding
        spaces); a workbook is read from its sheet ALL_PO_MASTER, else its first sheet. Every row with an empty PO, an
        ORDER QTY that is not a whole number of at least 1, a PODD or CRD that is not a date, or a PO number whose rows
        differ is an error (doc 04 section 10, A9). A dry run reports the errors and the counts of the valid rows;
        applying with any error answers 422 and writes nothing.
      security: [{ adminCookie: [] }]
      parameters: [{ in: query, name: dryRun, schema: { type: boolean, default: true } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary, description: 'At most 20 MB.' } } }
      responses:
        '200': { description: Import report., content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/ImportInvalid' }
  /admin/defects:
    get:
      tags: [admin]
      operationId: adminListDefects
      security: [{ adminCookie: [] }]
      responses:
        '200': { description: D001–D098 including inactive., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminDefect' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/defects/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdateDefect
      summary: Deactivate or reactivate a defect. Names are not editable in release 1 (doc 05 section 20.5).
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { $ref: '#/components/schemas/DefectId' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminActiveInput' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/AdminDefect' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/area-map:
    get:
      tags: [admin]
      operationId: adminGetAreaMap
      security: [{ adminCookie: [] }]
      responses:
        '200': { description: Areas, sub-areas, families and map rows, inactive included., content: { application/json: { schema: { $ref: '#/components/schemas/AdminAreaMap' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/area-map/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdateMapRow
      summary: Deactivate or reactivate one map row.
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminActiveInput' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/AdminMapRow' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/area-map/import:
    post:
      tags: [admin]
      operationId: adminImportAreaMap
      summary: Upload the mapping workbook (doc 02 section 5.1); upsert areas, sub-areas, families and map rows, never delete.
      description: |
        The same validation as the one-time import, against the stored defects (every DEFECT_ID must exist and carry
        the stored name). Stored rows missing from the workbook stay as they are and are listed in `warnings`
        (doc 04 section 10, A10). With any error a dry run reports the errors without counts and applying answers 422.
      security: [{ adminCookie: [] }]
      parameters: [{ in: query, name: dryRun, schema: { type: boolean, default: true } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary, description: 'At most 20 MB.' } } }
      responses:
        '200': { description: Import report., content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/ImportInvalid' }
  /admin/submissions:
    get:
      tags: [admin]
      operationId: adminListSubmissions
      security: [{ adminCookie: [] }]
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: factory, schema: { type: string } }
        - { in: query, name: cell, schema: { type: string } }
        - { in: query, name: username, schema: { type: string } }
        - { in: query, name: po, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
      responses:
        '200': { description: A page of submissions., content: { application/json: { schema: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/AdminSubmissionSummary' } } } } } } }
  /admin/submissions/{id}:
    get:
      tags: [admin]
      operationId: adminGetSubmission
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Submission with findings and photo ids., content: { application/json: { schema: { $ref: '#/components/schemas/AdminSubmissionSummary' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/photos/{id}:
    get:
      tags: [admin]
      operationId: adminGetPhoto
      security: [{ adminCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        '200': { description: The JPEG., content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Per-tablet key provisioned at install. Identifies the tablet; revocable.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminCookie:
      type: apiKey
      in: cookie
      name: m100_admin
      description: 'HttpOnly session cookie from POST /admin/auth/login. State-changing requests also send header X-Requested-With = m100-admin.'

  responses:
    Unauthorized:
      description: Missing or invalid device key or token. Codes DEVICE_KEY_INVALID, TOKEN_INVALID, TOKEN_EXPIRED; on /admin, ADMIN_AUTH_REQUIRED (no valid session cookie, or no X-Requested-With on a state change) and ADMIN_LOGIN_FAILED.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AdminLocked:
      description: Code ADMIN_LOCKED. The account is locked for 10 minutes after 5 failed logins; `Retry-After` gives the seconds left.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Codes PO_NOT_FOUND, NOT_FOUND.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Code SUBMISSION_UUID_REUSED (same UUID, different content); on /admin, CONFLICT (a duplicate natural key).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ImportInvalid:
      description: Code IMPORT_INVALID; `errors` lists every problem (path = sheet and row). Nothing was written (AC-14.3).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooLarge:
      description: Code PAYLOAD_TOO_LARGE (request over 8 MB or a photo over 1 MB; an admin import file over 20 MB).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: The request breaks a rule; `errors` lists each one. Not retryable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Code RATE_LIMITED. Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Codes SUBMIT_DISABLED, DB_UNAVAILABLE, PHOTO_STORE_UNAVAILABLE. Retryable.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    PsiLevel:
      type: string
      enum: [PSI lv.1, PSI lv.2]
    InspectionType:
      type: string
      enum: [REWORK, B-GRADE]
    Classification:
      type: string
      enum: [MINOR, MAJOR, CRITICAL]
    DefectId:
      type: string
      pattern: '^D0(0[1-9]|[1-8][0-9]|9[0-8])$'
    AreaId:
      type: string
      pattern: '^A(0[1-9]|1[0-2])$'

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ['https://m100/errors/validation-failed'] }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - DEVICE_KEY_INVALID
            - TOKEN_INVALID
            - TOKEN_EXPIRED
            - USER_NOT_FOUND
            - CELL_NOT_FOUND
            - PO_NOT_FOUND
            - SUBMISSION_UUID_REUSED
            - VALIDATION_FAILED
            - PHOTO_MISSING
            - PHOTO_NOT_ALLOWED
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - SUBMIT_DISABLED
            - DB_UNAVAILABLE
            - PHOTO_STORE_UNAVAILABLE
            - ADMIN_AUTH_REQUIRED
            - ADMIN_LOGIN_FAILED
            - ADMIN_LOCKED
            - NOT_FOUND
            - CONFLICT
            - IMPORT_INVALID
            - INTERNAL
        detail: { type: string, description: 'Indonesian, ready to show to the PSI.' }
        retryable: { type: boolean }
        errors:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: { type: string, examples: ['findings[2].qty'] }
              code: { type: string }
              message: { type: string }

    SystemStatus:
      type: object
      required: [submitEnabled, checkedAt, checks]
      properties:
        submitEnabled: { type: boolean }
        checkedAt: { type: string, format: date-time }
        masterDataVersion: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [id, ok]
            properties:
              id: { type: string, examples: [DB, MASTER_DATA, PHOTO_STORE, SUBMIT_ENABLED] }
              ok: { type: boolean }
              message: { type: string }

    LoginRequest:
      type: object
      required: [username, level, factory, cell]
      properties:
        username: { type: string, examples: ['AZIZAH'] }
        level: { $ref: '#/components/schemas/PsiLevel' }
        factory: { type: string, examples: ['F 3'] }
        cell: { type: string, examples: ['F3-10'] }

    User:
      type: object
      required: [username, level]
      properties:
        username: { type: string }
        level: { $ref: '#/components/schemas/PsiLevel' }

    LoginResponse:
      type: object
      required: [token, expiresAt, user, factory, cell]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        factory: { type: string }
        cell: { type: string }

    MasterData:
      type: object
      required: [version, fetchedAt, users, factories, areas, families, defects, map]
      properties:
        version: { type: string, description: 'Same value as the ETag.' }
        fetchedAt: { type: string, format: date-time }
        users:
          type: array
          items: { $ref: '#/components/schemas/User' }
        factories:
          type: array
          description: Only `F <number>` factories (doc 02 §3.2).
          items:
            type: object
            required: [factory, cells]
            properties:
              factory: { type: string, examples: ['F 3'] }
              cells:
                type: array
                items: { type: string, examples: ['F3-10'] }
        areas:
          type: array
          items:
            type: object
            required: [id, name, order, subAreas]
            properties:
              id: { $ref: '#/components/schemas/AreaId' }
              name: { type: string }
              order: { type: integer }
              subAreas:
                type: array
                items:
                  type: object
                  required: [id, name, order]
                  properties:
                    id: { type: string, examples: ['SA03L'] }
                    name: { type: string }
                    order: { type: integer }
        families:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, examples: ['F03'] }
              name: { type: string }
        defects:
          type: array
          items:
            type: object
            required: [id, name, classification, familyId]
            properties:
              id: { $ref: '#/components/schemas/DefectId' }
              name: { type: string }
              classification: { $ref: '#/components/schemas/Classification' }
              familyId: { type: string }
        map:
          type: array
          description: Active rows of M100_AREA_MAP.
          items:
            type: object
            required: [mapId, areaId, subAreaId, familyId, defectId]
            properties:
              mapId: { type: string }
              areaId: { $ref: '#/components/schemas/AreaId' }
              subAreaId: { type: string }
              familyId: { type: string }
              defectId: { $ref: '#/components/schemas/DefectId' }

    Po:
      type: object
      required: [po, article, model, destination, orderQty, podd, crd]
      properties:
        po: { type: string, examples: ['0903359388'] }
        article: { type: string }
        model: { type: string, description: 'Byte for byte from ALL_PO_MASTER (may contain U+00A0).' }
        destination: { type: string }
        orderQty: { type: integer }
        podd: { type: [string, 'null'], format: date }
        crd: { type: [string, 'null'], format: date }

    Finding:
      type: object
      description: One area + sub-area + defect + inspection type, with its total quantity.
      required: [inspectionType, areaId, subAreaId, defectId, qty, firstRecordedAt]
      properties:
        inspectionType: { $ref: '#/components/schemas/InspectionType' }
        areaId: { $ref: '#/components/schemas/AreaId' }
        subAreaId: { type: string }
        familyId: { type: string }
        defectId: { $ref: '#/components/schemas/DefectId' }
        qty: { type: integer, minimum: 1 }
        firstRecordedAt: { type: string, format: date-time, description: 'Breaks ties in slot order (doc 02 §6.2).' }

    SubmissionRequest:
      type: object
      required: [submissionUuid, sealedAt, appVersion, user, factory, cell, po, counts, findings]
      properties:
        submissionUuid: { type: string, format: uuid }
        sealedAt: { type: string, format: date-time }
        appVersion: { type: string, examples: ['1.0.0'] }
        user: { $ref: '#/components/schemas/User' }
        factory: { type: string }
        cell: { type: string }
        po: { type: string }
        partial:
          type: [object, 'null']
          description: PO PARTIAL (ADR-013); null when the PO isn't partial.
          required: [number, qty]
          properties:
            number: { type: integer, minimum: 1, maximum: 99, description: 'Partial number: 1 = P1.' }
            qty: { type: integer, minimum: 1 }
        counts:
          type: object
          description: Number of inspections started, by type (ADR-008).
          required: [rework, bGrade, noDefect]
          properties:
            rework: { type: integer, minimum: 0 }
            bGrade: { type: integer, minimum: 0 }
            noDefect: { type: integer, minimum: 0 }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        photos:
          type: array
          description: One entry per photo part. PSI lv.2 only, one per defect (ADR-011).
          items:
            type: object
            required: [defectId, part, sha256]
            properties:
              defectId: { $ref: '#/components/schemas/DefectId' }
              part: { type: string, examples: ['photo_D035'] }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    SubmissionResult:
      type: object
      required: [submissionUuid, status]
      properties:
        submissionUuid: { type: string, format: uuid }
        status:
          type: string
          enum: [written]
        displayNo: { type: string, examples: ['M100-000123'], description: 'Human number of the submission (doc 02 section 4.1).' }
        writtenAt: { type: string, format: date-time }
        totals:
          type: object
          properties:
            qtyInspection: { type: integer }
            qtyAGrade: { type: integer }
            qtyBGrade: { type: integer }
            qtyDefect: { type: integer }
            rft: { type: number }
            defectRate: { type: number }

    AdminPsiUser:
      type: object
      required: [id, username, level, active]
      properties:
        id: { type: integer }
        username: { type: string }
        level: { $ref: '#/components/schemas/PsiLevel' }
        active: { type: boolean }
    AdminPsiUserCreate:
      type: object
      additionalProperties: false
      required: [username, level]
      properties:
        username: { type: string, minLength: 1, maxLength: 100, description: 'Exactly as shown on screen; no spaces at either end.' }
        level: { $ref: '#/components/schemas/PsiLevel' }
        active: { type: boolean, default: true }
    AdminPsiUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        level: { $ref: '#/components/schemas/PsiLevel' }
        active: { type: boolean }
    AdminFactory:
      type: object
      required: [id, name, active]
      properties:
        id: { type: integer }
        name: { type: string, examples: ['F 3'], description: 'Only `F <number>` factories reach the tablets.' }
        active: { type: boolean }
    AdminCell:
      type: object
      required: [id, factoryId, factory, code, active]
      properties:
        id: { type: integer }
        factoryId: { type: integer }
        factory: { type: string }
        code: { type: string, examples: ['F3-10'] }
        active: { type: boolean }
    AdminPo:
      allOf:
        - { $ref: '#/components/schemas/Po' }
        - type: object
          required: [finished, active, source]
          properties:
            finished: { type: [boolean, 'null'], description: 'Not imported or editable until PRD OQ-06 is decided.' }
            active: { type: boolean }
            source: { type: string, examples: ['admin', 'import:ALL_PO_MASTER.csv'] }
    AdminPoCreate:
      type: object
      additionalProperties: false
      required: [po, article, model, destination, orderQty, podd, crd]
      properties:
        po: { type: string, minLength: 1, maxLength: 40, description: 'Kept exactly; no spaces at either end.' }
        article: { type: string, maxLength: 200 }
        model: { type: string, maxLength: 200 }
        destination: { type: string, maxLength: 200 }
        orderQty: { type: integer, minimum: 1 }
        podd: { type: [string, 'null'], format: date }
        crd: { type: [string, 'null'], format: date }
    AdminPoInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        article: { type: string, maxLength: 200 }
        model: { type: string, maxLength: 200 }
        destination: { type: string, maxLength: 200 }
        orderQty: { type: integer, minimum: 1 }
        podd: { type: [string, 'null'], format: date }
        crd: { type: [string, 'null'], format: date }
        active: { type: boolean }
    AdminActiveInput:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: { type: boolean }
    AdminDefect:
      type: object
      required: [id, name, classification, ctqCategory, ctqCode, active]
      properties:
        id: { $ref: '#/components/schemas/DefectId' }
        name: { type: string, description: 'Exactly as in the defect list; D049 and D071 share a name (ADR-009).' }
        classification: { $ref: '#/components/schemas/Classification' }
        ctqCategory: { type: [string, 'null'] }
        ctqCode: { type: [string, 'null'] }
        active: { type: boolean }
    AdminMapRow:
      type: object
      required: [id, areaId, subAreaId, familyId, defectId, active]
      properties:
        id: { type: string, examples: ['MAP-035-03'] }
        areaId: { $ref: '#/components/schemas/AreaId' }
        subAreaId: { type: string }
        familyId: { type: string }
        defectId: { $ref: '#/components/schemas/DefectId' }
        active: { type: boolean }
    AdminAreaMap:
      type: object
      required: [areas, subAreas, families, rows]
      properties:
        areas:
          type: array
          items:
            type: object
            required: [id, name, sort, active]
            properties: { id: { $ref: '#/components/schemas/AreaId' }, name: { type: string }, sort: { type: integer }, active: { type: boolean } }
        subAreas:
          type: array
          items:
            type: object
            required: [id, areaId, name, sort, active]
            properties: { id: { type: string }, areaId: { $ref: '#/components/schemas/AreaId' }, name: { type: string }, sort: { type: integer }, active: { type: boolean } }
        families:
          type: array
          items:
            type: object
            required: [id, name, active]
            properties: { id: { type: string }, name: { type: string }, active: { type: boolean } }
        rows: { type: array, items: { $ref: '#/components/schemas/AdminMapRow' } }
    ImportReport:
      type: object
      required: [dryRun, read, inserted, updated, skipped, errors, warnings]
      properties:
        dryRun: { type: boolean }
        read: { type: integer, description: 'Non-empty rows read (map rows for the mapping workbook).' }
        inserted: { type: integer }
        updated: { type: integer }
        skipped: { type: integer, description: 'Rows that change nothing: unchanged in the database, or the same as an earlier row of the file.' }
        errors:
          type: array
          description: Every invalid row; while any exists, applying is refused (AC-14.3).
          items:
            type: object
            required: [sheet, code, message]
            properties:
              sheet: { type: string }
              row: { type: integer, description: 'Row in the sheet; 1 is the header.' }
              code: { type: string, examples: ['PO_EMPTY', 'ORDER_QTY_INVALID', 'DATE_INVALID', 'PO_CONFLICT', 'MAPPING_INVALID'] }
              message: { type: string }
        warnings: { type: array, items: { type: string }, description: 'Not errors, e.g. stored rows the workbook does not list (A10).' }
        tables:
          type: object
          description: Counts per table (mapping workbook).
          additionalProperties:
            type: object
            required: [inserted, updated, unchanged]
            properties: { inserted: { type: integer }, updated: { type: integer }, unchanged: { type: integer } }
    AdminSubmissionSummary:
      type: object
      required: [id, displayNo, sealedAt, username, level, po]
      properties:
        id: { type: string, format: uuid }
        displayNo: { type: string }
        sealedAt: { type: string, format: date-time }
        username: { type: string }
        level: { $ref: '#/components/schemas/PsiLevel' }
        factory: { type: string }
        cell: { type: string }
        po: { type: string }
        partialText: { type: [string, 'null'], examples: ['P1 1.200 OF 10.002'] }
        qtyInspection: { type: integer }
        qtyDefect: { type: integer }
        qtyAGrade: { type: integer }
        qtyBGrade: { type: integer }
        rft: { type: number }
        defectRate: { type: number }
        photoCount: { type: integer }
        findings:
          type: array
          description: Only in the detail response.
          items: { type: object }
        photos:
          type: array
          description: Only in the detail response.
          items: { type: object, properties: { id: { type: integer }, defectId: { type: string } } }
